<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medify - Next-Gen RCM Platform</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 650px;
            padding: 50px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        /* Modern Text Logo */
        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 1.8rem;
            color: #e2e8f0;
            margin-bottom: 15px;
            font-weight: 500;
        }
        p {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        /* Lead Collection Form Styles */
        .form-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .form-group {
            display: flex;
            gap: 10px;
        }
        input {
            padding: 14px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
            flex: 1;
        }
        input:focus {
            border-color: #38bdf8;
        }
        input::placeholder {
            color: #64748b;
        }
        button {
            padding: 14px 25px;
            border: none;
            background: linear-gradient(90deg, #0284c7, #0ea5e9);
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        button:hover {
            background: linear-gradient(90deg, #0ea5e9, #38bdf8);
            transform: translateY(-1px);
        }
        .contact-info {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #475569;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Modern Text Logo -->
        <div class="logo">Medify</div>
        <br>
        <div class="badge">Launching Soon</div>
        
        <h1>Reimagining Medical Billing for U.S. Practices</h1>
        <p>We are building a next-gen Revenue Cycle Management (RCM) platform to streamline your claims, reduce denials, and maximize revenue.</p>
        
        <!-- Lead Collection Form -->
        <form action="https://formspree.io/f/your-form-id" method="POST" class="form-wrapper">
            <div class="form-group">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Work Email" required>
            </div>
            <input type="text" name="practice_name" placeholder="Practice / Clinic Name (Optional)">
            <button type="submit">Request Early Access</button>
        </form>

        <div class="contact-info">
            Direct Inquiries: <a href="mailto:shivambhadouriya@medifyclaims.com" style="color: #64748b; text-decoration: none;">shivambhadouriya@medifyclaims.com</a>
        </div>
    </div>
</body>
</html>
